name: Release Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character application revision.
        required: true
        type: string
      approval_ref:
        description: Protected production approval reference.
        required: true
        type: string
      qualifying_run_id:
        description: Successful Verify Main run identifier.
        required: true
        type: string

permissions:
  contents: read

jobs:
  controller-artifact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    if: github.repository == 'Krowaccie/AppWriteWork-verification-control' && github.sha == vars.TRUSTED_CONTROLLER_SHA
    outputs:
      status: ${{ steps.controller-artifact-proof.outputs.status }}
      repository: ${{ steps.controller-artifact-proof.outputs.repository }}
      sha: ${{ steps.controller-artifact-proof.outputs.sha }}
      artifact_id: ${{ steps.controller-artifact-proof.outputs.artifact_id }}
      bundle_digest: ${{ steps.controller-artifact-proof.outputs.bundle_digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Prove exact immutable controller artifact
        id: controller-artifact-proof
        shell: bash
        env:
          CONTROLLER_ARTIFACT_READ_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_ARTIFACT_ID: ${{ vars.TRUSTED_CONTROLLER_ARTIFACT_ID }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            CONTROLLER_ARTIFACT_READ_TOKEN="$CONTROLLER_ARTIFACT_READ_TOKEN" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            TRUSTED_CONTROLLER_ARTIFACT_ID="$TRUSTED_CONTROLLER_ARTIFACT_ID" \
            TRUSTED_CONTROLLER_BUNDLE_DIGEST="$TRUSTED_CONTROLLER_BUNDLE_DIGEST" \
            TRUSTED_CONTROLLER_SHA="$TRUSTED_CONTROLLER_SHA" \
            node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import { verifyGithubControllerArtifact } from './packages/verification-controller/src/github-controller-artifact-verifier.mjs';

          const pointer = Object.freeze({
            artifactId: process.env.TRUSTED_CONTROLLER_ARTIFACT_ID,
            authorization: process.env.CONTROLLER_ARTIFACT_READ_TOKEN,
            bundleDigest: process.env.TRUSTED_CONTROLLER_BUNDLE_DIGEST,
            repository: process.env.GITHUB_REPOSITORY,
            requiredEntrypoint: 'packages/verification-controller/workflows/release-production.yml',
            runtimeSha: process.env.GITHUB_SHA,
            trustedSha: process.env.TRUSTED_CONTROLLER_SHA,
          });
          const verified = await verifyGithubControllerArtifact(pointer);
          if (verified.status !== 'PASS') {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          await appendFile(process.env.GITHUB_OUTPUT, [
            'status=' + verified.status,
            'repository=' + verified.value.controllerRepository,
            'sha=' + verified.value.controllerBundleSha,
            'artifact_id=' + verified.value.controllerArtifactId,
            'bundle_digest=' + verified.value.controllerBundleDigest,
          ].join('\n') + '\n');
          NODE

  source-artifact-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    needs: controller-artifact-proof
    if: needs.controller-artifact-proof.outputs.status == 'PASS' && github.repository == 'Krowaccie/AppWriteWork-verification-control' && github.sha == vars.TRUSTED_CONTROLLER_SHA
    outputs:
      artifact_id: ${{ steps.verified-input-upload.outputs.artifact-id }}
      excluded_test_only_classification_digest: ${{ steps.verified-handoff.outputs.classification_digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validate dispatch and trusted controller identity before credentials
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          QUALIFYING_RUN_ID: ${{ inputs.qualifying_run_id }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFYING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REPOSITORY" = Krowaccie/AppWriteWork-verification-control
          test "$GITHUB_SHA" = "$TRUSTED_CONTROLLER_SHA"

      - name: Reattest immutable controller artifact locally
        shell: bash
        env:
          CONTROLLER_PROOF_ARTIFACT_ID: ${{ needs.controller-artifact-proof.outputs.artifact_id }}
          CONTROLLER_PROOF_BUNDLE_DIGEST: ${{ needs.controller-artifact-proof.outputs.bundle_digest }}
          CONTROLLER_PROOF_REPOSITORY: ${{ needs.controller-artifact-proof.outputs.repository }}
          CONTROLLER_PROOF_SHA: ${{ needs.controller-artifact-proof.outputs.sha }}
          CONTROLLER_PROOF_STATUS: ${{ needs.controller-artifact-proof.outputs.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_ARTIFACT_ID: ${{ vars.TRUSTED_CONTROLLER_ARTIFACT_ID }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            CONTROLLER_PROOF_ARTIFACT_ID="$CONTROLLER_PROOF_ARTIFACT_ID" \
            CONTROLLER_PROOF_BUNDLE_DIGEST="$CONTROLLER_PROOF_BUNDLE_DIGEST" \
            CONTROLLER_PROOF_REPOSITORY="$CONTROLLER_PROOF_REPOSITORY" \
            CONTROLLER_PROOF_SHA="$CONTROLLER_PROOF_SHA" \
            CONTROLLER_PROOF_STATUS="$CONTROLLER_PROOF_STATUS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            TRUSTED_CONTROLLER_ARTIFACT_ID="$TRUSTED_CONTROLLER_ARTIFACT_ID" \
            TRUSTED_CONTROLLER_BUNDLE_DIGEST="$TRUSTED_CONTROLLER_BUNDLE_DIGEST" \
            TRUSTED_CONTROLLER_SHA="$TRUSTED_CONTROLLER_SHA" \
            node --input-type=module <<'NODE'
          import { reattestLocalControllerArtifact } from './packages/verification-controller/src/github-controller-artifact-verifier.mjs';

          const input = Object.freeze({
            artifactId: process.env.CONTROLLER_PROOF_ARTIFACT_ID,
            bundleDigest: process.env.CONTROLLER_PROOF_BUNDLE_DIGEST,
            proofRepository: process.env.CONTROLLER_PROOF_REPOSITORY,
            proofSha: process.env.CONTROLLER_PROOF_SHA,
            proofStatus: process.env.CONTROLLER_PROOF_STATUS,
            repository: process.env.GITHUB_REPOSITORY,
            requiredEntrypoint: 'packages/verification-controller/workflows/release-production.yml',
            runtimeSha: process.env.GITHUB_SHA,
            trustedArtifactId: process.env.TRUSTED_CONTROLLER_ARTIFACT_ID,
            trustedBundleDigest: process.env.TRUSTED_CONTROLLER_BUNDLE_DIGEST,
            trustedSha: process.env.TRUSTED_CONTROLLER_SHA,
          });
          const reattested = await reattestLocalControllerArtifact(input);
          if (reattested.status !== 'PASS') {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          NODE

      - name: Read source artifact and build closed verified handoff
        id: verified-handoff
        shell: bash
        env:
          SOURCE_ARTIFACT_READER_APP_ID: ${{ vars.SOURCE_ARTIFACT_READER_APP_ID }}
          SOURCE_ARTIFACT_READER_INSTALLATION_ID: ${{ vars.SOURCE_ARTIFACT_READER_INSTALLATION_ID }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_VERIFY_MAIN_WORKFLOW_ID: ${{ vars.SOURCE_VERIFY_MAIN_WORKFLOW_ID }}
          SOURCE_QUALIFYING_RUN_ATTEMPT: ${{ vars.SOURCE_QUALIFYING_RUN_ATTEMPT }}
          SOURCE_ARTIFACT_READER_PRIVATE_KEY: ${{ secrets.SOURCE_ARTIFACT_READER_PRIVATE_KEY }}
          APPLICATION_SHA: ${{ inputs.revision }}
          QUALIFYING_RUN_ID: ${{ inputs.qualifying_run_id }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
          QUALIFYING_LOCAL_EVIDENCE_DIGEST: ${{ vars.QUALIFYING_LOCAL_EVIDENCE_DIGEST }}
          QUALIFYING_TEST_CLOUD_EVIDENCE_DIGEST: ${{ vars.QUALIFYING_TEST_CLOUD_EVIDENCE_DIGEST }}
          QUALIFYING_STATUS: ${{ vars.QUALIFYING_STATUS }}
          QUALIFYING_TEST_LEASE_STATUS: ${{ vars.QUALIFYING_TEST_LEASE_STATUS }}
          QUALIFYING_CLEANUP_DEBT: ${{ vars.QUALIFYING_CLEANUP_DEBT }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile, rm, writeFile, mkdir } from 'node:fs/promises';
          import { join } from 'node:path';
          import {
            extractSourceArtifactZip,
            readBoundedSourceArtifactArchive,
            readSourceArtifact,
          } from './packages/verification-controller/src/source-artifact-reader.mjs';
          import {
            buildVerifiedProductionHandoff,
            validateVerifiedProductionHandoff,
          } from './packages/verification-controller/src/verified-production-handoff.mjs';

          function blocked(code) {
            const error = new Error('BLOCKED ' + code);
            error.code = code;
            return error;
          }

          async function request(path, options = {}) {
            if (typeof path !== 'string' || !path.startsWith('/')) {
              throw blocked('SOURCE_REQUEST_PATH_INVALID');
            }
            let response = await fetch('https://api.github.com' + path, {
              method: options.method,
              headers: options.headers,
              body: options.body,
              redirect: 'manual',
            });
            if (path.endsWith('/zip') && response.status >= 300 && response.status < 400) {
              const location = response.headers.get('location');
              if (typeof location !== 'string') throw blocked('SOURCE_ARTIFACT_REDIRECT_INVALID');
              const target = new URL(location);
              if (target.protocol !== 'https:' ||
                  (!target.hostname.endsWith('.blob.core.windows.net') &&
                   target.hostname !== 'objects.githubusercontent.com')) {
                throw blocked('SOURCE_ARTIFACT_REDIRECT_INVALID');
              }
              response = await fetch(target, { method: 'GET', redirect: 'error' });
            }
            if (path.endsWith('/zip')) {
              if (response.status !== 200) return { status: response.status };
              return {
                status: response.status,
                bytes: await readBoundedSourceArtifactArchive(
                  response,
                  options.expectedBytes,
                ),
              };
            }
            if (response.status === 204) return { status: 204 };
            const text = await response.text();
            let body;
            try {
              body = text.length === 0 ? undefined : JSON.parse(text);
            } catch {
              throw blocked('SOURCE_RESPONSE_INVALID');
            }
            return { status: response.status, body };
          }

          const source = await readSourceArtifact({
            config: {
              appId: process.env.SOURCE_ARTIFACT_READER_APP_ID,
              installationId: process.env.SOURCE_ARTIFACT_READER_INSTALLATION_ID,
              sourceRepositoryId: Number(process.env.SOURCE_REPOSITORY_ID),
              sourceWorkflowId: Number(process.env.SOURCE_VERIFY_MAIN_WORKFLOW_ID),
            },
            revision: process.env.APPLICATION_SHA,
            qualifyingRunId: process.env.QUALIFYING_RUN_ID,
            runAttempt: Number(process.env.SOURCE_QUALIFYING_RUN_ATTEMPT),
            privateKey: process.env.SOURCE_ARTIFACT_READER_PRIVATE_KEY,
            request,
            readZip: extractSourceArtifactZip,
          });
          const inventory = JSON.parse(await readFile(
            './dev/verification/environments/production.inventory.v1.json',
            'utf8',
          ));
          const built = buildVerifiedProductionHandoff({
            source: {
              ...source,
              controllerRevision: process.env.GITHUB_SHA,
              controllerBundleDigest: process.env.TRUSTED_CONTROLLER_BUNDLE_DIGEST,
              localEvidenceDigest: process.env.QUALIFYING_LOCAL_EVIDENCE_DIGEST,
              testCloudEvidenceDigest: process.env.QUALIFYING_TEST_CLOUD_EVIDENCE_DIGEST,
              qualifyingStatus: process.env.QUALIFYING_STATUS,
              testLeaseStatus: process.env.QUALIFYING_TEST_LEASE_STATUS,
              cleanupDebt: process.env.QUALIFYING_CLEANUP_DEBT === 'false' ? false : true,
            },
            inventory,
            files: source.files,
          });
          validateVerifiedProductionHandoff({
            handoff: built.handoff,
            files: built.files,
            inventory,
            expectedExcludedTestOnlyProof: built.handoff.excludedTestOnlyProof,
          });

          const output = '.verified-production-input';
          await rm(output, { recursive: true, force: true });
          await mkdir(output, { recursive: true });
          await writeFile(
            join(output, 'verified-production-handoff.v1.json'),
            JSON.stringify(built.handoff),
          );
          for (const [relativePath, artifactBytes] of built.files) {
            const destination = join(output, ...relativePath.split('/'));
            await mkdir(join(destination, '..'), { recursive: true });
            await writeFile(destination, artifactBytes);
          }
          await appendFile(
            process.env.GITHUB_OUTPUT,
            'classification_digest=' + built.handoff.excludedTestOnlyProof.classificationDigest + '\n',
          );
          NODE

      - name: Upload exact verified production input
        id: verified-input-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-production-input-${{ inputs.revision }}
          path: .verified-production-input
          if-no-files-found: error
          retention-days: 1

  appwrite-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release
    needs:
      - controller-artifact-proof
      - source-artifact-read
    if: needs.controller-artifact-proof.outputs.status == 'PASS' && github.repository == 'Krowaccie/AppWriteWork-verification-control' && github.sha == vars.TRUSTED_CONTROLLER_SHA
    outputs:
      release_execution_artifact_id: ${{ steps.release-execution-upload.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validate trusted controller identity before credentials
        shell: bash
        env:
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Krowaccie/AppWriteWork-verification-control
          test "$GITHUB_SHA" = "$TRUSTED_CONTROLLER_SHA"

      - name: Reattest immutable controller artifact locally
        shell: bash
        env:
          CONTROLLER_PROOF_ARTIFACT_ID: ${{ needs.controller-artifact-proof.outputs.artifact_id }}
          CONTROLLER_PROOF_BUNDLE_DIGEST: ${{ needs.controller-artifact-proof.outputs.bundle_digest }}
          CONTROLLER_PROOF_REPOSITORY: ${{ needs.controller-artifact-proof.outputs.repository }}
          CONTROLLER_PROOF_SHA: ${{ needs.controller-artifact-proof.outputs.sha }}
          CONTROLLER_PROOF_STATUS: ${{ needs.controller-artifact-proof.outputs.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_ARTIFACT_ID: ${{ vars.TRUSTED_CONTROLLER_ARTIFACT_ID }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            CONTROLLER_PROOF_ARTIFACT_ID="$CONTROLLER_PROOF_ARTIFACT_ID" \
            CONTROLLER_PROOF_BUNDLE_DIGEST="$CONTROLLER_PROOF_BUNDLE_DIGEST" \
            CONTROLLER_PROOF_REPOSITORY="$CONTROLLER_PROOF_REPOSITORY" \
            CONTROLLER_PROOF_SHA="$CONTROLLER_PROOF_SHA" \
            CONTROLLER_PROOF_STATUS="$CONTROLLER_PROOF_STATUS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            TRUSTED_CONTROLLER_ARTIFACT_ID="$TRUSTED_CONTROLLER_ARTIFACT_ID" \
            TRUSTED_CONTROLLER_BUNDLE_DIGEST="$TRUSTED_CONTROLLER_BUNDLE_DIGEST" \
            TRUSTED_CONTROLLER_SHA="$TRUSTED_CONTROLLER_SHA" \
            node --input-type=module <<'NODE'
          import { reattestLocalControllerArtifact } from './packages/verification-controller/src/github-controller-artifact-verifier.mjs';

          const input = Object.freeze({
            artifactId: process.env.CONTROLLER_PROOF_ARTIFACT_ID,
            bundleDigest: process.env.CONTROLLER_PROOF_BUNDLE_DIGEST,
            proofRepository: process.env.CONTROLLER_PROOF_REPOSITORY,
            proofSha: process.env.CONTROLLER_PROOF_SHA,
            proofStatus: process.env.CONTROLLER_PROOF_STATUS,
            repository: process.env.GITHUB_REPOSITORY,
            requiredEntrypoint: 'packages/verification-controller/workflows/release-production.yml',
            runtimeSha: process.env.GITHUB_SHA,
            trustedArtifactId: process.env.TRUSTED_CONTROLLER_ARTIFACT_ID,
            trustedBundleDigest: process.env.TRUSTED_CONTROLLER_BUNDLE_DIGEST,
            trustedSha: process.env.TRUSTED_CONTROLLER_SHA,
          });
          const reattested = await reattestLocalControllerArtifact(input);
          if (reattested.status !== 'PASS') {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          NODE

      - name: Download exact verified handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.source-artifact-read.outputs.artifact_id }}
          path: .verified-input

      - name: Attest downloaded handoff digest before credential mapping
        id: handoff-digest
        shell: bash
        run: |
          set -euo pipefail
          test -f .verified-input/verified-production-handoff.v1.json
          printf 'sha256=%s\n' "$(sha256sum .verified-input/verified-production-handoff.v1.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Release exact verified input with a closed child environment
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          GITHUB_ENVIRONMENT: production-release
          PRODUCTION_RELEASE_APPROVED: ${{ vars.PRODUCTION_RELEASE_APPROVED }}
          PRODUCTION_RELEASE_APPROVED_SHA: ${{ vars.PRODUCTION_RELEASE_APPROVED_SHA }}
          PRODUCTION_RELEASE_APPROVED_ACTION: ${{ vars.PRODUCTION_RELEASE_APPROVED_ACTION }}
          PRODUCTION_RELEASE_APPROVAL_REF: ${{ vars.PRODUCTION_RELEASE_APPROVAL_REF }}
          VERIFIED_HANDOFF_SHA256: sha256:${{ steps.handoff-digest.outputs.sha256 }}
          EXPECTED_EXCLUDED_TEST_ONLY_CLASSIFICATION_DIGEST: ${{ needs.source-artifact-read.outputs.excluded_test_only_classification_digest }}
          APPWRITE_PRODUCTION_RELEASE_API_KEY: ${{ secrets.APPWRITE_PRODUCTION_RELEASE_API_KEY }}
          APPLICATION_SHA: ${{ inputs.revision }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          QUALIFYING_RUN_ID: ${{ inputs.qualifying_run_id }}
        run: |
          set -euo pipefail
          mkdir -p .release-execution
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            TRUSTED_CONTROLLER_SHA="$TRUSTED_CONTROLLER_SHA" \
            GITHUB_ENVIRONMENT="$GITHUB_ENVIRONMENT" \
            PRODUCTION_RELEASE_APPROVED="$PRODUCTION_RELEASE_APPROVED" \
            PRODUCTION_RELEASE_APPROVED_SHA="$PRODUCTION_RELEASE_APPROVED_SHA" \
            PRODUCTION_RELEASE_APPROVED_ACTION="$PRODUCTION_RELEASE_APPROVED_ACTION" \
            PRODUCTION_RELEASE_APPROVAL_REF="$PRODUCTION_RELEASE_APPROVAL_REF" \
            VERIFIED_HANDOFF_SHA256="$VERIFIED_HANDOFF_SHA256" \
            EXPECTED_EXCLUDED_TEST_ONLY_CLASSIFICATION_DIGEST="$EXPECTED_EXCLUDED_TEST_ONLY_CLASSIFICATION_DIGEST" \
            APPWRITE_PRODUCTION_RELEASE_API_KEY="$APPWRITE_PRODUCTION_RELEASE_API_KEY" \
            npm --prefix packages/verification-controller run release:production -- \
              --revision "$APPLICATION_SHA" \
              --approval-ref "$APPROVAL_REF" \
              --qualifying-run-id "$QUALIFYING_RUN_ID" \
              --verified-handoff ".verified-input/verified-production-handoff.v1.json" \
              | tail -n 1 > .release-execution/release-execution-result.v1.json

      - name: Validate canonical partial release result
        id: partial-release-validation
        if: failure() && hashFiles('.release-execution/partial-release-execution-result.v1.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          import {
            canonicalPartialReleaseRecordBytes,
            validatePartialReleaseRecord,
          } from './packages/verification-controller/src/production-release-executor.mjs';

          const path =
            '.release-execution/partial-release-execution-result.v1.json';
          const raw = await readFile(path);
          let partial;
          try {
            partial = JSON.parse(raw.toString('utf8'));
            validatePartialReleaseRecord(partial);
          } catch {
            throw new Error('BLOCKED PRODUCTION_RELEASE_PARTIAL_RECORD_INVALID');
          }
          const canonical = canonicalPartialReleaseRecordBytes(partial);
          if (!Buffer.from(canonical).equals(raw)) {
            throw new Error('BLOCKED PRODUCTION_RELEASE_PARTIAL_RECORD_INVALID');
          }
          await appendFile(process.env.GITHUB_OUTPUT, 'validated=true\n');
          NODE

      - name: Upload canonical partial release result
        id: partial-release-upload
        if: failure() && steps.partial-release-validation.outputs.validated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: partial-release-execution-result-${{ inputs.revision }}
          path: .release-execution/partial-release-execution-result.v1.json
          if-no-files-found: error
          retention-days: 1

      - name: Fail after preserving partial release result
        if: failure() && steps.partial-release-validation.outputs.validated == 'true'
        shell: bash
        run: |
          exit 2

      - name: Validate closed release execution result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { validateRedactedReleaseExecutionResult } from './packages/verification-controller/src/github-deployment-writer.mjs';

          const execution = JSON.parse(await readFile(
            '.release-execution/release-execution-result.v1.json',
            'utf8',
          ));
          validateRedactedReleaseExecutionResult(execution);
          NODE

      - name: Upload closed release execution result
        id: release-execution-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-execution-result-${{ inputs.revision }}
          path: .release-execution/release-execution-result.v1.json
          if-no-files-found: error
          retention-days: 1

  publish-release-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    needs:
      - controller-artifact-proof
      - appwrite-release
    if: needs.controller-artifact-proof.outputs.status == 'PASS' && needs.appwrite-release.result == 'success' && github.repository == 'Krowaccie/AppWriteWork-verification-control' && github.sha == vars.TRUSTED_CONTROLLER_SHA
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validate trusted controller identity before publisher credential
        shell: bash
        env:
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Krowaccie/AppWriteWork-verification-control
          test "$GITHUB_SHA" = "$TRUSTED_CONTROLLER_SHA"

      - name: Reattest immutable controller artifact locally
        shell: bash
        env:
          CONTROLLER_PROOF_ARTIFACT_ID: ${{ needs.controller-artifact-proof.outputs.artifact_id }}
          CONTROLLER_PROOF_BUNDLE_DIGEST: ${{ needs.controller-artifact-proof.outputs.bundle_digest }}
          CONTROLLER_PROOF_REPOSITORY: ${{ needs.controller-artifact-proof.outputs.repository }}
          CONTROLLER_PROOF_SHA: ${{ needs.controller-artifact-proof.outputs.sha }}
          CONTROLLER_PROOF_STATUS: ${{ needs.controller-artifact-proof.outputs.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_ARTIFACT_ID: ${{ vars.TRUSTED_CONTROLLER_ARTIFACT_ID }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            CONTROLLER_PROOF_ARTIFACT_ID="$CONTROLLER_PROOF_ARTIFACT_ID" \
            CONTROLLER_PROOF_BUNDLE_DIGEST="$CONTROLLER_PROOF_BUNDLE_DIGEST" \
            CONTROLLER_PROOF_REPOSITORY="$CONTROLLER_PROOF_REPOSITORY" \
            CONTROLLER_PROOF_SHA="$CONTROLLER_PROOF_SHA" \
            CONTROLLER_PROOF_STATUS="$CONTROLLER_PROOF_STATUS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            TRUSTED_CONTROLLER_ARTIFACT_ID="$TRUSTED_CONTROLLER_ARTIFACT_ID" \
            TRUSTED_CONTROLLER_BUNDLE_DIGEST="$TRUSTED_CONTROLLER_BUNDLE_DIGEST" \
            TRUSTED_CONTROLLER_SHA="$TRUSTED_CONTROLLER_SHA" \
            node --input-type=module <<'NODE'
          import { reattestLocalControllerArtifact } from './packages/verification-controller/src/github-controller-artifact-verifier.mjs';

          const input = Object.freeze({
            artifactId: process.env.CONTROLLER_PROOF_ARTIFACT_ID,
            bundleDigest: process.env.CONTROLLER_PROOF_BUNDLE_DIGEST,
            proofRepository: process.env.CONTROLLER_PROOF_REPOSITORY,
            proofSha: process.env.CONTROLLER_PROOF_SHA,
            proofStatus: process.env.CONTROLLER_PROOF_STATUS,
            repository: process.env.GITHUB_REPOSITORY,
            requiredEntrypoint: 'packages/verification-controller/workflows/release-production.yml',
            runtimeSha: process.env.GITHUB_SHA,
            trustedArtifactId: process.env.TRUSTED_CONTROLLER_ARTIFACT_ID,
            trustedBundleDigest: process.env.TRUSTED_CONTROLLER_BUNDLE_DIGEST,
            trustedSha: process.env.TRUSTED_CONTROLLER_SHA,
          });
          const reattested = await reattestLocalControllerArtifact(input);
          if (reattested.status !== 'PASS') {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          NODE

      - name: Download exact release execution result
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.appwrite-release.outputs.release_execution_artifact_id }}
          path: .release-execution

      - name: Build deterministic canonical release record
        id: release-record
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ENVIRONMENT: production-release
          APPLICATION_SHA: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFile, mkdir, readFile, writeFile } from 'node:fs/promises';
          import {
            buildReleaseRecord,
            canonicalReleaseRecordBytes,
            validateRedactedReleaseExecutionResult,
          } from './packages/verification-controller/src/github-deployment-writer.mjs';

          const execution = JSON.parse(await readFile(
            '.release-execution/release-execution-result.v1.json',
            'utf8',
          ));
          validateRedactedReleaseExecutionResult(execution);
          if (execution.sourceRevision !== process.env.APPLICATION_SHA) {
            throw new Error('BLOCKED RELEASE_EXECUTION_RESULT_INVALID');
          }
          const github = Object.freeze({
            repository: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            environment: process.env.GITHUB_ENVIRONMENT,
          });
          const releaseRecord = buildReleaseRecord({ executionResult: execution, github });
          const bytes = canonicalReleaseRecordBytes(releaseRecord);
          await mkdir('.release-record', { recursive: true });
          await writeFile('.release-record/release-record.v1.json', bytes, { flag: 'wx' });
          const recordArtifactDigest =
            'sha256:' + createHash('sha256').update(bytes).digest('hex');
          await appendFile(
            process.env.GITHUB_OUTPUT,
            'record_artifact_digest=' + recordArtifactDigest + '\n',
          );
          NODE

      - name: Upload canonical release record before creating Deployment
        id: release-record-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-record-${{ inputs.revision }}
          path: .release-record/release-record.v1.json
          if-no-files-found: error
          retention-days: 1

      - name: Create protected control-repository Deployment and success status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          RELEASE_RECORD_ARTIFACT_ID: ${{ steps.release-record-upload.outputs.artifact-id }}
          RELEASE_RECORD_ARTIFACT_DIGEST: ${{ steps.release-record.outputs.record_artifact_digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import {
            createGithubDeploymentWriter,
            validateRedactedReleaseRecord,
          } from './packages/verification-controller/src/github-deployment-writer.mjs';

          if (process.env.GITHUB_REPOSITORY !== 'Krowaccie/AppWriteWork-verification-control'
              || process.env.GITHUB_SHA !== process.env.TRUSTED_CONTROLLER_SHA) {
            throw new Error('BLOCKED CONTROLLER_ATTESTATION_MISMATCH');
          }
          if (!/^[1-9][0-9]*$/.test(process.env.RELEASE_RECORD_ARTIFACT_ID ?? '')) {
            throw new Error('BLOCKED RELEASE_RECORD_ARTIFACT_ID_INVALID');
          }
          const rawArtifactDigest = process.env.RELEASE_RECORD_ARTIFACT_DIGEST ?? '';
          const recordArtifactDigest = rawArtifactDigest.startsWith('sha256:')
            ? rawArtifactDigest
            : 'sha256:' + rawArtifactDigest;
          if (!/^sha256:[0-9a-f]{64}$/.test(recordArtifactDigest)) {
            throw new Error('BLOCKED RELEASE_RECORD_ARTIFACT_DIGEST_INVALID');
          }
          const releaseRecord = JSON.parse(await readFile(
            '.release-record/release-record.v1.json',
            'utf8',
          ));
          validateRedactedReleaseRecord(releaseRecord);
          const credential = Object.freeze({
            apply(headers = {}) {
              return { ...headers, Authorization: 'Bearer ' + process.env.GITHUB_TOKEN };
            },
          });
          const writer = createGithubDeploymentWriter({
            repository: 'Krowaccie/AppWriteWork-verification-control',
            controller: Object.freeze({
              repository: process.env.GITHUB_REPOSITORY,
              sha: process.env.GITHUB_SHA,
              trustedControllerSha: process.env.TRUSTED_CONTROLLER_SHA,
            }),
            githubCredentialHandle: credential,
            request: async (path, options) => {
              const response = await fetch('https://api.github.com' + path, {
                ...options,
                redirect: 'error',
              });
              const text = await response.text();
              let body;
              try {
                body = text.length === 0 ? undefined : JSON.parse(text);
              } catch {
                throw new Error('BLOCKED GITHUB_DEPLOYMENT_RESPONSE_INVALID');
              }
              if (!response.ok) throw new Error('BLOCKED GITHUB_DEPLOYMENT_REQUEST_FAILED');
              return body;
            },
          });
          await writer.publish({
            controllerRevision: process.env.GITHUB_SHA,
            releaseRecord,
            recordArtifactId: process.env.RELEASE_RECORD_ARTIFACT_ID,
            recordArtifactDigest,
          });
          NODE

# The candidate repository is never checked out or executed.
