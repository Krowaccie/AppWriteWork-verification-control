name: Controller validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Controller validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          package-manager-cache: false

      - name: Install exact controller dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete controller test suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'packages/verification-controller/src/appwrite-test-browser-policy.test.mjs'
            'packages/verification-controller/src/appwrite-test-live-readback.test.mjs'
            'packages/verification-controller/src/appwrite-test-setup-bindings.test.mjs'
            'packages/verification-controller/src/collect-appwrite-test-readback-workflow.test.mjs'
            'packages/verification-controller/src/collect-appwrite-test-readback.test.mjs'
            'packages/verification-controller/src/controller-bundle-publisher.test.mjs'
            'packages/verification-controller/src/controller-seed-source-sets-schema.test.mjs'
            'packages/verification-controller/src/prepare-controller-artifact.test.mjs'
            'packages/verification-controller/src/production-exact-sha-git-adapter.test.mjs'
            'packages/verification-controller/src/recover-appwrite-test-workflow.test.mjs'
            'packages/verification-controller/src/source-artifact-reader.test.mjs'
            'packages/verification-controller/src/test-cloud-binding-artifact-verifier.test.mjs'
            'packages/verification-controller/src/test-cloud-binding-workflows.test.mjs'
            'packages/verification-controller/src/test-cloud-browser-artifact-set.test.mjs'
            'packages/verification-controller/src/test-cloud-browser-route-adapter.test.mjs'
            'packages/verification-controller/src/test-cloud-cleanup-driver.test.mjs'
            'packages/verification-controller/src/test-cloud-contained-browser-scenario-adapter.test.mjs'
            'packages/verification-controller/src/test-cloud-controller-binding-directory.test.mjs'
            'packages/verification-controller/src/test-cloud-controller-source-diagnostics.test.mjs'
            'packages/verification-controller/src/test-cloud-controller.test.mjs'
            'packages/verification-controller/src/test-cloud-fixture-clock.test.mjs'
            'packages/verification-controller/src/test-cloud-fixture-intent-producer.test.mjs'
            'packages/verification-controller/src/test-cloud-provider-bootstrap.test.mjs'
            'packages/verification-controller/src/test-cloud-recovery-controller.test.mjs'
            'packages/verification-controller/src/test-cloud-source-artifact-reader.test.mjs'
          )
          for test_path in "${tests[@]}"; do
            node --test --test-isolation=none "$test_path"
          done

      - name: Run A1 OCI contract suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'a1-oci/tests/a1-supervisor-client.test.mjs'
            'a1-oci/tests/hosted-runtime.test.mjs'
            'a1-oci/tests/typecheck-driver.test.mjs'
            'a1-oci/tests/validated-artifact-upload.test.mjs'
            'a1-oci/tests/workspace-kernel-driver.test.mjs'
          )
          for test_path in "${tests[@]}"; do
            node --test --test-isolation=none "$test_path"
          done

      - name: Validate promoted A1 composite wrapper
        shell: bash
        run: |
          set -euo pipefail
          action_root='.github/actions/a1-source-artifact-launcher'
          image='ghcr.io/krowaccie/appwritework-verification-a1@sha256:a752173ccf4649dd5e453990a40ea2e6f4b61dbd1da6ae018e3424cab70645b4'

          cmp "$action_root/action.yml.template" "$action_root/action.yml"
          sed "s|__A1_IMMUTABLE_OCI_IMAGE_REQUIRED__|$image|" \
            "$action_root/run-a1.sh.template" | cmp - "$action_root/run-a1.sh"
          grep -Fq 'using: composite' "$action_root/action.yml"
          test "$(grep -Fc -- '--cap-add ' "$action_root/run-a1.sh")" = '7'
          for capability in CHOWN DAC_OVERRIDE FOWNER SYS_ADMIN SYS_PTRACE SETUID SETGID; do
            grep -Fq -- "--cap-add $capability" "$action_root/run-a1.sh"
          done
          grep -Fq -- '--cap-drop ALL' "$action_root/run-a1.sh"
          test "$(grep -Foc -- '--security-opt ' "$action_root/run-a1.sh")" = '1'
          grep -Fq -- '--security-opt apparmor=unconfined' "$action_root/run-a1.sh"
          grep -Fq -- '--user 0' "$action_root/run-a1.sh"
          grep -Fq -- 'dst=/github/workspace,readonly' "$action_root/run-a1.sh"
          grep -Fq -- 'dst=/work/host-output' "$action_root/run-a1.sh"
          grep -Fq -- 'A1_VALIDATED_ARTIFACT_OUTPUT=/work/host-output' "$action_root/run-a1.sh"
          grep -Fq -- 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$action_root/action.yml"
          grep -Fq -- 'retention-days: 7' "$action_root/action.yml"
          if grep -Eq -- '--privileged|seccomp=unconfined|NET_ADMIN|docker[.]sock|ACTIONS_RUNTIME_TOKEN|ACTIONS_RESULTS_URL' "$action_root/run-a1.sh"; then
            echo 'A1 wrapper broadens the reviewed isolation profile.' >&2
            exit 1
          fi

      - name: Validate public secret-free governance
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          test -f README.md
          grep -Fq 'PUBLIC_SECRET_FREE' README.md

          if git ls-files | grep -Eiq '(^|/)([.]env($|[.])|.*[.](pem|p12|pfx|key)$|id_rsa($|[.]))'; then
            echo 'Forbidden secret-like tracked file name.' >&2
            exit 1
          fi

          workflow_files=()
          while IFS= read -r -d '' workflow; do
            workflow_files+=("$workflow")
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z)
          test "${#workflow_files[@]}" -gt 0

          node --input-type=module - "${workflow_files[@]}" <<'NODE'
          import { readFile } from 'node:fs/promises';

          const PINNED_ACTION = /^[^\s@]+@[0-9a-f]{40}$/u;
          const PINNED_DOCKER = /^docker:\/\/[a-z0-9][a-z0-9._/:+-]*@sha256:[0-9a-f]{64}$/u;
          const LOCAL_ACTION = /^\.(?:\/)(?!.*(?:^|\/)\.\.(?:\/|$))[A-Za-z0-9._/-]+$/u;
          const PROTECTED_ENVIRONMENTS = new Set(['appwrite-test', 'controller-promotion']);
          const SENSITIVE_KEYS = new Set(['environment', 'jobs', 'name', 'on', 'steps', 'uses']);
          const EXPRESSION_OPEN = String.fromCodePoint(36, 123, 123);

          function blocked(message) {
            throw new Error(`BLOCKED WORKFLOW_GOVERNANCE_INVALID: ${message}`);
          }

          function indentation(line) {
            return line.length - line.trimStart().length;
          }

          function parseScalar(value) {
            const trimmed = value.trim();
            if (trimmed === 'null' || trimmed === '~') return null;
            if (trimmed === 'true') return true;
            if (trimmed === 'false') return false;
            if (/^-?(?:0|[1-9][0-9]*)$/u.test(trimmed)) return Number(trimmed);
            if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
              const inner = trimmed.slice(1, -1).trim();
              return inner === '' ? [] : inner.split(',').map((entry) => parseScalar(entry));
            }
            if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
              return JSON.parse(trimmed);
            }
            if (trimmed.startsWith("'") && trimmed.endsWith("'")) {
              return trimmed.slice(1, -1).replaceAll("''", "'");
            }
            if (trimmed.includes('#')) blocked('inline comments are unsupported');
            if (/^[&*!]/u.test(trimmed)) blocked('unsupported YAML scalar shape');
            return trimmed;
          }

          function parseWorkflowYaml(source) {
            if (source.includes('\t')) blocked('tabs are forbidden');
            const lines = source.replaceAll('\r\n', '\n').split('\n');

            function skipIgnored(start) {
              let index = start;
              while (index < lines.length) {
                const trimmed = lines[index].trim();
                if (trimmed !== '' && !trimmed.startsWith('#')) break;
                index += 1;
              }
              return index;
            }

            function parseBlockScalar(start, parentIndent) {
              let index = start;
              let contentIndent = null;
              const values = [];
              while (index < lines.length) {
                const line = lines[index];
                if (line.trim() !== '' && indentation(line) <= parentIndent) break;
                if (line.trim() !== '' && contentIndent === null) contentIndent = indentation(line);
                if (line.trim() === '') values.push('');
                else {
                  if (indentation(line) < contentIndent) blocked('invalid block-scalar indentation');
                  values.push(line.slice(contentIndent));
                }
                index += 1;
              }
              return [values.join('\n').replace(/\n+$/u, ''), index];
            }

            function assign(target, key, value) {
              if (Object.hasOwn(target, key)) blocked(`duplicate YAML key ${key}`);
              target[key] = value;
            }

            function parseMapping(start, expectedIndent, seed = Object.create(null)) {
              const result = seed;
              let index = start;
              while (index < lines.length) {
                index = skipIgnored(index);
                if (index >= lines.length) break;
                const line = lines[index];
                const currentIndent = indentation(line);
                if (currentIndent < expectedIndent) break;
                if (currentIndent !== expectedIndent) blocked(`unexpected indentation at line ${index + 1}`);
                const content = line.slice(currentIndent);
                if (content.startsWith('- ')) break;
                const match = /^([A-Za-z0-9_-]+):(?:\s*(.*))?$/u.exec(content);
                if (match === null) blocked(`unsupported mapping at line ${index + 1}`);
                const [, key, rawValue = ''] = match;
                index += 1;
                if (rawValue === '|') {
                  const [parsed, nextIndex] = parseBlockScalar(index, currentIndent);
                  assign(result, key, parsed);
                  index = nextIndex;
                } else if (rawValue !== '') {
                  assign(result, key, parseScalar(rawValue));
                } else {
                  const next = skipIgnored(index);
                  if (next < lines.length && indentation(lines[next]) > currentIndent) {
                    const [parsed, nextIndex] = parseNode(next, indentation(lines[next]));
                    assign(result, key, parsed);
                    index = nextIndex;
                  } else {
                    assign(result, key, null);
                    index = next;
                  }
                }
              }
              return [result, index];
            }

            function parseSequence(start, expectedIndent) {
              const result = [];
              let index = start;
              while (index < lines.length) {
                index = skipIgnored(index);
                if (index >= lines.length) break;
                const line = lines[index];
                const currentIndent = indentation(line);
                if (currentIndent < expectedIndent) break;
                if (currentIndent !== expectedIndent) blocked(`unexpected sequence indentation at line ${index + 1}`);
                const content = line.slice(currentIndent);
                if (!content.startsWith('- ')) break;
                const inline = content.slice(2);
                const match = /^([A-Za-z0-9_-]+):(?:\s*(.*))?$/u.exec(inline);
                if (match === null) {
                  result.push(parseScalar(inline));
                  index += 1;
                  continue;
                }
                const item = Object.create(null);
                const [, key, rawValue = ''] = match;
                assign(item, key, rawValue === '' ? null : parseScalar(rawValue));
                index += 1;
                const next = skipIgnored(index);
                if (next < lines.length && indentation(lines[next]) > currentIndent) {
                  const [parsed, nextIndex] = parseMapping(next, indentation(lines[next]), item);
                  result.push(parsed);
                  index = nextIndex;
                } else {
                  result.push(item);
                  index = next;
                }
              }
              return [result, index];
            }

            function parseNode(start, expectedIndent) {
              return lines[start].slice(expectedIndent).startsWith('- ')
                ? parseSequence(start, expectedIndent)
                : parseMapping(start, expectedIndent);
            }

            const start = skipIgnored(0);
            if (start === lines.length) blocked('empty workflow');
            const [parsed, end] = parseNode(start, 0);
            if (skipIgnored(end) !== lines.length) blocked('unparsed YAML');
            return parsed;
          }

          function isRecord(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
          }

          function validateActionReference(value) {
            if (typeof value !== 'string') blocked('uses must be a scalar string');
            if (value.startsWith('docker://')) {
              if (!PINNED_DOCKER.test(value)) blocked('Docker action must use one immutable SHA-256 digest');
            } else if (!LOCAL_ACTION.test(value) && !PINNED_ACTION.test(value)) {
              blocked('external action must use one immutable 40-character revision');
            }
          }

          function validateSensitiveShape(value) {
            if (Array.isArray(value)) {
              value.forEach(validateSensitiveShape);
              return;
            }
            if (!isRecord(value)) return;
            for (const [key, child] of Object.entries(value)) {
              const lower = key.toLowerCase();
              if (SENSITIVE_KEYS.has(lower) && key !== lower) blocked(`invalid key case ${key}`);
              if (key === 'uses') validateActionReference(child);
              validateSensitiveShape(child);
            }
          }

          function environmentName(value) {
            if (typeof value === 'string') return value;
            if (!isRecord(value) || !Object.hasOwn(value, 'name')) blocked('invalid environment shape');
            if (Object.keys(value).some((key) => !['name', 'url'].includes(key))) {
              blocked('invalid environment mapping keys');
            }
            if (typeof value.name !== 'string') blocked('environment.name must be a scalar string');
            return value.name;
          }

          for (const workflowPath of process.argv.slice(2)) {
            if (!/\.(?:yml|yaml)$/u.test(workflowPath)) blocked('workflow extension is not governed');
            const workflow = parseWorkflowYaml(await readFile(workflowPath, 'utf8'));
            validateSensitiveShape(workflow);
            if (!isRecord(workflow.jobs) || Object.keys(workflow.jobs).length === 0) {
              blocked('jobs must be a nonempty mapping');
            }
            let credentialBearing = false;
            for (const job of Object.values(workflow.jobs)) {
              if (!isRecord(job)) blocked('job must be a mapping');
              if (!Object.hasOwn(job, 'environment')) continue;
              const name = environmentName(job.environment);
              if (name.includes(EXPRESSION_OPEN)) blocked('dynamic environment names are forbidden');
              const normalized = name.toLowerCase();
              if (PROTECTED_ENVIRONMENTS.has(normalized)) {
                if (name !== normalized) blocked('protected environment name must use exact case');
                credentialBearing = true;
              }
            }
            if (credentialBearing) {
              if (!isRecord(workflow.on)) blocked('credential workflow triggers must be a mapping');
              const triggerNames = Object.keys(workflow.on);
              if (triggerNames.length !== 1 || triggerNames[0] !== 'workflow_dispatch') {
                blocked('credential-bearing workflow must be manual-only');
              }
            }
          }
          NODE
