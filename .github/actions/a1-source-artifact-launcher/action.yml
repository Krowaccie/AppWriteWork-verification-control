name: Trusted source artifact launcher
description: Composite launcher for the reviewed immutable A1 OCI image.
inputs:
  request:
    description: Canonical verification-a1-hosted-request.v1 JSON.
    required: true
runs:
  using: composite
  steps:
    - name: Run trusted A1 OCI launcher
      shell: bash
      env:
        A1_HOSTED_REQUEST: ${{ inputs.request }}
      run: bash "$GITHUB_ACTION_PATH/run-a1.sh"
