name: Verify Test Cloud

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact successful Verify Main source revision.
        required: true
        type: string
      source_run_id:
        description: Exact successful Verify Main workflow run ID.
        required: true
        type: string
      source_run_attempt:
        description: Exact successful Verify Main workflow run attempt.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: appwrite-test-verification
  cancel-in-progress: false

jobs:
  verify-test-cloud:
    runs-on: windows-2025
    timeout-minutes: 45
    environment: appwrite-test
    if: github.repository == 'Krowaccie/AppWriteWork-verification-control'
    steps:
      - name: Validate immutable controller revision
        shell: pwsh
        env:
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($value in @($env:TRUSTED_CONTROLLER_SHA, $env:WORKFLOW_HEAD_SHA)) {
            if ($value -cnotmatch '^[0-9a-f]{40}$') { throw 'BLOCKED CONTROLLER_REVISION_INVALID' }
          }
          if ($env:WORKFLOW_HEAD_SHA -cne $env:TRUSTED_CONTROLLER_SHA) {
            throw 'BLOCKED CONTROLLER_REVISION_MISMATCH'
          }

      - name: Checkout only the trusted controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          package-manager-cache: false

      - name: Verify exact Node.js and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.11.1"
          test "$(npm --version)" = "11.6.2"

      - name: Prove exact immutable controller artifact
        shell: bash
        env:
          CONTROLLER_ARTIFACT_READ_TOKEN: ${{ github.token }}
          CONTROLLER_ARTIFACT_DIRECTORY: ${{ runner.temp }}\controller-artifact
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          TRUSTED_CONTROLLER_ARTIFACT_ID: ${{ vars.TRUSTED_CONTROLLER_ARTIFACT_ID }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            GITHUB_ENV="$GITHUB_ENV" \
            CONTROLLER_ARTIFACT_READ_TOKEN="$CONTROLLER_ARTIFACT_READ_TOKEN" \
            CONTROLLER_ARTIFACT_DIRECTORY="$CONTROLLER_ARTIFACT_DIRECTORY" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            TRUSTED_CONTROLLER_ARTIFACT_ID="$TRUSTED_CONTROLLER_ARTIFACT_ID" \
            TRUSTED_CONTROLLER_BUNDLE_DIGEST="$TRUSTED_CONTROLLER_BUNDLE_DIGEST" \
            TRUSTED_CONTROLLER_SHA="$TRUSTED_CONTROLLER_SHA" \
            node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { lstat, mkdir, readFile, realpath, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import {
            extractBoundedZipArchive,
            MAX_VERIFICATION_ARCHIVE_BYTES,
            readBoundedResponseBytes,
          } from './packages/verification-controller/src/controller-archive-verifier.mjs';
          import { verifyGithubControllerArtifact } from './packages/verification-controller/src/github-controller-artifact-verifier.mjs';
          import { createProductionExactShaGitAdapter } from './packages/verification-controller/src/production-exact-sha-git-adapter.mjs';

          const root = path.resolve('.');
          const proposal = JSON.parse(await readFile(
            path.join(root, 'packages/verification-controller/controller-bundle.proposal.json'),
            'utf8',
          ));
          const git = createProductionExactShaGitAdapter({ repositoryRoot: root });

          const pointer = Object.freeze({
            artifactId: process.env.TRUSTED_CONTROLLER_ARTIFACT_ID,
            authorization: process.env.CONTROLLER_ARTIFACT_READ_TOKEN,
            bundleDigest: process.env.TRUSTED_CONTROLLER_BUNDLE_DIGEST,
            repository: process.env.GITHUB_REPOSITORY,
            requiredEntrypoint: 'packages/verification-controller/workflows/verify-test-cloud.yml',
            runtimeSha: process.env.GITHUB_SHA,
            trustedSha: process.env.TRUSTED_CONTROLLER_SHA,
          });
          const verified = await verifyGithubControllerArtifact(pointer, {
            fetchImpl: globalThis.fetch,
            git,
            lstat,
            now: Date.now,
            proposal,
            readFile,
            realpath,
            root,
          });
          if (verified.status !== 'PASS') {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          const redirectResponse = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${verified.value.controllerArtifactId}/zip`,
            {
              method: 'GET',
              redirect: 'manual',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.CONTROLLER_ARTIFACT_READ_TOKEN}`,
                'User-Agent': 'appwritework-verification-controller',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            },
          );
          const rawLocation = redirectResponse.headers.get('location');
          let signedUrl = null;
          try {
            const candidate = new URL(rawLocation);
            const hostname = candidate.hostname.toLowerCase();
            if (
              redirectResponse.status === 302
              && candidate.protocol === 'https:'
              && (
                hostname === 'objects.githubusercontent.com'
                || hostname.endsWith('.githubusercontent.com')
                || hostname.endsWith('.blob.core.windows.net')
              )
              && candidate.username === ''
              && candidate.password === ''
              && (candidate.port === '' || candidate.port === '443')
              && candidate.pathname.startsWith('/')
              && candidate.pathname.length > 1
              && candidate.hash === ''
            ) signedUrl = candidate.toString();
          } catch {}
          if (signedUrl === null) throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          const archiveResponse = await fetch(signedUrl, {
            method: 'GET',
            redirect: 'error',
            headers: {
              Accept: 'application/octet-stream',
              'User-Agent': 'appwritework-verification-controller',
            },
          });
          if (archiveResponse.status !== 200) {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          const archive = await readBoundedResponseBytes(
            archiveResponse,
            MAX_VERIFICATION_ARCHIVE_BYTES,
          );
          const archiveDigest = `sha256:${createHash('sha256').update(archive).digest('hex')}`;
          if (archiveDigest !== verified.value.controllerBundleDigest) {
            throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          }
          const artifactRoot = path.resolve(process.env.CONTROLLER_ARTIFACT_DIRECTORY);
          if (
            !path.isAbsolute(process.env.CONTROLLER_ARTIFACT_DIRECTORY)
            || artifactRoot !== process.env.CONTROLLER_ARTIFACT_DIRECTORY
          ) throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
          await mkdir(artifactRoot);
          const entries = [...extractBoundedZipArchive(archive).entries()]
            .sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0);
          for (const [relativePath, bytes] of entries) {
            const destination = path.resolve(artifactRoot, ...relativePath.split('/'));
            if (!destination.startsWith(`${artifactRoot}${path.sep}`)) {
              throw new Error('BLOCKED TRUSTED_CONTROLLER_REQUIRED');
            }
            await mkdir(path.dirname(destination), { recursive: true });
            await writeFile(destination, bytes, { flag: 'wx', mode: 0o600 });
          }
          appendFileSync(process.env.GITHUB_ENV, [
            'PROOF_STATUS=PASS',
            'PROOF_REPOSITORY=' + verified.value.controllerRepository,
            'PROOF_SHA=' + verified.value.controllerBundleSha,
            'PROOF_ARTIFACT_ID=' + verified.value.controllerArtifactId,
            'PROOF_BUNDLE_DIGEST=' + verified.value.controllerBundleDigest,
            '',
          ].join('\n'), 'utf8');
          NODE

      - name: Install the exact trusted controller dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact Appwrite Test binding artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTROLLER_REVISION: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          SOURCE_REPOSITORY_REVISION: ${{ inputs.revision }}
          RUNNER_REVISION: ${{ vars.VERIFICATION_RUNNER_REVISION }}
          BINDING_ARTIFACT_ID: ${{ vars.TRUSTED_TEST_CLOUD_BINDING_ARTIFACT_ID }}
          BINDING_ARTIFACT_DIGEST: ${{ vars.TRUSTED_TEST_CLOUD_BINDING_ARTIFACT_DIGEST }}
          BINDING_VERIFIER_INPUT: ${{ runner.temp }}\test-cloud-binding-verifier-input.json
          BINDING_DIRECTORY: ${{ runner.temp }}\test-cloud-bindings
        run: |
          $ErrorActionPreference = 'Stop'
          node --input-type=module -e @'
          import { writeFile } from 'node:fs/promises';
          import { canonicalJson } from './scripts/verification/canonical-json.mjs';
          const input = {
            artifactId: process.env.BINDING_ARTIFACT_ID,
            bundleDigest: process.env.BINDING_ARTIFACT_DIGEST,
            initialSeed: false,
            runnerRevision: process.env.RUNNER_REVISION,
            sourceRepositoryRevision: process.env.SOURCE_REPOSITORY_REVISION,
            trustedSha: process.env.CONTROLLER_REVISION,
          };
          await writeFile(process.env.BINDING_VERIFIER_INPUT, `${canonicalJson(input)}\n`, { flag: 'wx' });
          '@
          node packages/verification-controller/src/test-cloud-binding-artifact-verifier.mjs --input $env:BINDING_VERIFIER_INPUT --output $env:BINDING_DIRECTORY

      - name: Install pinned Playwright Chromium
        shell: bash
        run: npm exec --package=playwright@1.61.1 -- playwright install chromium

      - name: Run the one-process staged controller
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          TRUSTED_CONTROLLER_ARTIFACT_ID: ${{ vars.TRUSTED_CONTROLLER_ARTIFACT_ID }}
          TRUSTED_CONTROLLER_BUNDLE_DIGEST: ${{ vars.TRUSTED_CONTROLLER_BUNDLE_DIGEST }}
          SOURCE_ARTIFACT_READER_APP_ID: ${{ vars.SOURCE_ARTIFACT_READER_APP_ID }}
          SOURCE_ARTIFACT_READER_INSTALLATION_ID: ${{ vars.SOURCE_ARTIFACT_READER_INSTALLATION_ID }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_VERIFY_MAIN_WORKFLOW_ID: ${{ vars.SOURCE_VERIFY_MAIN_WORKFLOW_ID }}
          CONTROLLER_ARTIFACT_DIRECTORY: ${{ runner.temp }}\controller-artifact
          BINDING_DIRECTORY: ${{ runner.temp }}\test-cloud-bindings
          SOURCE_ARTIFACT_READER_PRIVATE_KEY: ${{ secrets.SOURCE_ARTIFACT_READER_PRIVATE_KEY }}
          APPWRITE_TEST_OPERATOR_API_KEY: ${{ secrets.APPWRITE_TEST_OPERATOR_API_KEY }}
          APPWRITE_TEST_FIXTURE_API_KEY: ${{ secrets.APPWRITE_TEST_FIXTURE_API_KEY }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
        run: node packages/verification-controller/src/test-cloud-controller.mjs --hosted --revision "$REQUESTED_REVISION" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" --binding-directory "$BINDING_DIRECTORY"

# The staged controller performs tokenless reattestLocalControllerArtifact in
# the same process that admits source-reader and ordinary-lane credentials.
# Candidate artifact bytes remain inert data and are never checked out or run.
# Recovery is a separate approved job and the ordinary lane never maps its credential.
