name: Verify Main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Krowaccie/AppWriteWork'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24.11.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          package-manager-cache: false

      - name: Assert exact Node.js and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.11.1"
          test "$(npm --version)" = "11.6.2"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: |
          npm ci
          npm ci --prefix verification/controller --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/mcp-bridge

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r verification/core/runtime/python-local-requirements.lock

      - name: Resolve verification base
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "VERIFY_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
              ;;
            push)
              echo "VERIFY_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
              ;;
            workflow_dispatch)
              echo "VERIFY_BASE_SHA=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
              ;;
            *)
              exit 2
              ;;
          esac

      - name: Run local verification
        id: local-verification
        continue-on-error: true
        shell: bash
        run: npm run verify -- --lane local --base "$VERIFY_BASE_SHA" --head "$GITHUB_SHA"

      - name: Upload sanitized local verification evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/results/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish local verification report
        id: verification-report
        continue-on-error: true
        shell: bash
        run: npm run verify:report -- --lane local --base "$VERIFY_BASE_SHA" --head "$GITHUB_SHA" --report-path "${{ runner.temp }}/verification-report.json"

      - name: Upload sanitized verification report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Diagnose verifier self-test failure
        if: failure() || steps.local-verification.outcome == 'failure' || steps.verification-report.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: node verification/core/run-tests.mjs

      - name: Admit bounded source artifact publication
        if: "!cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.local-verification.outcome == 'success' || steps.local-verification.outcome == 'failure')"
        id: source-artifact-publication-admission
        shell: bash
        run: node verification/core/source-artifact-publication-admission.mjs --revision "$GITHUB_SHA"

      - name: Bind hosted source artifact request
        if: "!cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.source-artifact-publication-admission.outcome == 'success'"
        id: source-artifact-request
        shell: bash
        run: node verification/core/hosted-source-artifact-request.mjs

      - name: Publish validated hosted source artifact
        if: "!cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.source-artifact-request.outcome == 'success'"
        uses: Krowaccie/AppWriteWork-verification-control/.github/actions/a1-source-artifact-launcher@1a336033645b0bd99f70bdb439400ed6b2de1f13
        with:
          request: ${{ steps.source-artifact-request.outputs.request }}
