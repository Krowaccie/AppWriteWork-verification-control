name: Publish Controller Bundle

on:
  workflow_dispatch:
    inputs:
      trusted_controller_sha:
        description: Exact reviewed controller commit to publish.
        required: true
        type: string
      bundle_manifest_digest:
        description: Exact reviewed portable verifier manifest SHA-256 digest.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-controller-bundle
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Krowaccie/AppWriteWork-verification-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: controller-promotion
    steps:
      - name: Validate immutable reviewed request
        env:
          REQUESTED_SHA: ${{ inputs.trusted_controller_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          TRUSTED_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
          REQUESTED_DIGEST: ${{ inputs.bundle_manifest_digest }}
          TRUSTED_DIGEST: ${{ vars.PORTABLE_VERIFIER_BUNDLE_DIGEST }}
        run: |
          node --input-type=module -e '
          const e = process.env;
          if (!/^[a-f0-9]{40}$/.test(e.REQUESTED_SHA ?? "") || e.REQUESTED_SHA !== e.WORKFLOW_SHA || e.REQUESTED_SHA !== e.TRUSTED_SHA) throw new Error("CONTROLLER_REVISION_MISMATCH");
          if (!/^sha256:[a-f0-9]{64}$/.test(e.REQUESTED_DIGEST ?? "") || e.REQUESTED_DIGEST !== e.TRUSTED_DIGEST) throw new Error("BUNDLE_DIGEST_MISMATCH");
          '
      - name: Checkout exact reviewed controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.trusted_controller_sha }}
          persist-credentials: false
      - name: Set up qualified Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Validate exact export and negative controls
        env:
          BUNDLE_DIGEST: ${{ inputs.bundle_manifest_digest }}
        run: |
          node bundle/verification/controller/portable/cli.mjs verify --bundle bundle --digest "$BUNDLE_DIGEST"
          node --test bundle/verification/controller/portable/*.test.mjs bundle/verification/adapters/portable/sentinel.test.mjs
      - name: Publish verifier files only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-verifier-${{ inputs.trusted_controller_sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
      # Publication never activates a pin or starts a product audit.
