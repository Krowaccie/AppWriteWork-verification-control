name: Controller validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Controller validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          package-manager-cache: false

      - name: Install exact controller dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete controller test suite
        shell: bash
        run: node --test --test-isolation=none packages/verification-controller/src/*.test.mjs

      - name: Run A1 OCI contract suite
        shell: bash
        run: node --test --test-isolation=none a1-oci/tests/*.test.mjs

      - name: Validate promoted A1 composite wrapper
        shell: bash
        run: |
          set -euo pipefail
          action_root='.github/actions/a1-source-artifact-launcher'
          image='ghcr.io/krowaccie/appwritework-verification-a1@sha256:ff23ed8834201d90e4c6e67b6f4c6ed66626c2b4bea897147b407647197f15e8'

          cmp "$action_root/action.yml.template" "$action_root/action.yml"
          sed "s|__A1_IMMUTABLE_OCI_IMAGE_REQUIRED__|$image|" \
            "$action_root/run-a1.sh.template" | cmp - "$action_root/run-a1.sh"
          grep -Fq 'using: composite' "$action_root/action.yml"
          test "$(grep -Fc -- '--cap-add ' "$action_root/run-a1.sh")" = '4'
          for capability in SYS_ADMIN SYS_PTRACE SETUID SETGID; do
            grep -Fq -- "--cap-add $capability" "$action_root/run-a1.sh"
          done
          grep -Fq -- '--cap-drop ALL' "$action_root/run-a1.sh"
          test "$(grep -Foc -- '--security-opt ' "$action_root/run-a1.sh")" = '1'
          grep -Fq -- '--security-opt apparmor=unconfined' "$action_root/run-a1.sh"
          grep -Fq -- '--user 0' "$action_root/run-a1.sh"
          grep -Fq -- 'dst=/github/workspace,readonly' "$action_root/run-a1.sh"
          grep -Fq -- 'dst=/work/host-output' "$action_root/run-a1.sh"
          grep -Fq -- 'A1_VALIDATED_ARTIFACT_OUTPUT=/work/host-output' "$action_root/run-a1.sh"
          grep -Fq -- 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$action_root/action.yml"
          grep -Fq -- 'retention-days: 7' "$action_root/action.yml"
          if grep -Eq -- '--privileged|seccomp=unconfined|NET_ADMIN|docker[.]sock|ACTIONS_RUNTIME_TOKEN|ACTIONS_RESULTS_URL' "$action_root/run-a1.sh"; then
            echo 'A1 wrapper broadens the reviewed isolation profile.' >&2
            exit 1
          fi

      - name: Validate public secret-free governance
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          test -f README.md
          grep -Fq 'PUBLIC_SECRET_FREE' README.md

          if git ls-files | grep -Eiq '(^|/)([.]env($|[.])|.*[.](pem|p12|pfx|key)$|id_rsa($|[.]))'; then
            echo 'Forbidden secret-like tracked file name.' >&2
            exit 1
          fi

          while IFS= read -r workflow; do
            unpinned="$(grep -E '^[[:space:]]*uses:' "$workflow" | grep -Ev 'uses:[[:space:]]*(./|docker://|[^[:space:]@]+@[0-9a-f]{40}([[:space:]]|$))' || true)"
            if [[ -n "$unpinned" ]]; then
              echo "Unpinned external action in $workflow" >&2
              echo "$unpinned" >&2
              exit 1
            fi

            if grep -Eq 'environment:[[:space:]]*(appwrite-test|controller-promotion)' "$workflow"; then
              grep -Eq '^[[:space:]]+workflow_dispatch:' "$workflow"
              if grep -Eq '^[[:space:]]+(pull_request|pull_request_target|push):' "$workflow"; then
                echo "Credential-bearing workflow is not manual-only: $workflow" >&2
                exit 1
              fi
            fi
          done < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -print | sort)
