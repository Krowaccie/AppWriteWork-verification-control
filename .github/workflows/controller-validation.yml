name: Controller validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Controller validation
    if: github.repository == 'Krowaccie/AppWriteWork-verification-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout controller code only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up qualified Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Validate bundle integrity and controller fixtures
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { canonical, digest, verifyBundle } from "./bundle/verification/controller/portable/bundle.mjs"; const manifest = JSON.parse(readFileSync("bundle/portable-verifier.bundle.v1.json")); verifyBundle({bundleRoot: "bundle", expectedDigest: digest(canonical(manifest))});'
          node --test bundle/verification/controller/portable/*.test.mjs bundle/verification/adapters/portable/sentinel.test.mjs
      # Checker fixture validation never fetches product candidates, runs the
      # repository audit or dispatches another job.
